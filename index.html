    <span class="lsep"></span>
    <button class="lb" data-act="lens-close" title="Kitaba dön (Esc)" aria-label="Kapat"><svg><use href="#i-x"/></svg></button>
   </div>
  </div>
  <div class="lens-view" id="lensView"><div class="lens-sheet" id="lensSheet"></div></div>
  <div class="lens-nav">
   <button class="lb" data-act="lens-forward" aria-label="Sonraki sayfa"><svg><use href="#i-left"/></svg></button>
   <span id="lensPage">Sayfa 10–11</span>
   <button class="lb" data-act="lens-back" aria-label="Önceki sayfa"><svg><use href="#i-right"/></svg></button>
  </div>
 </div>

 <div class="tip" id="tip" role="tooltip" hidden></div>
 <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
</body>
</html>
